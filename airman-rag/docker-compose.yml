version: '3.8'

services:
  airman-rag:
    build: .
    container_name: airman-rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data        # Persist FAISS index & chunks
      - ./aviation_docs:/app/aviation_docs  # Mount PDFs here
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
